name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  # Full matrix (see the `test-full` job) on days when nothing merges, so a
  # runner-image or interpreter patch release cannot break a leg unnoticed.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancelling a main-branch run would discard the only check of the merged
  # result, so only supersede pull request runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Install dependencies
        run: uv sync --locked --dev --no-build

      - name: Run ruff linter
        run: uv run --no-sync --no-build ruff check src/ tests/

      - name: Check ruff formatting
        run: uv run --no-sync --no-build ruff format --check src/ tests/

      # Also checks tests/test_type_checking.py, whose assert_type() calls are
      # invisible to pytest; see that module's docstring.
      - name: Run mypy type checker
        run: uv run --no-sync --no-build mypy src/ tests/test_type_checking.py

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Never leave the job token in .git/config: this job runs
      # contributor-controlled Sphinx code and doctests.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # Read the Docs installs the same `docs` extra from uv.lock (see
      # .readthedocs.yaml), so the gate and the published build resolve
      # identical documentation dependencies.
      - name: Install dependencies
        run: uv sync --locked --no-dev --extra docs --no-build

      # Warnings are errors and the doctest builder proves the examples run.
      # `-E` forces a fresh read so a cached environment cannot hide a warning;
      # the same commands run locally (CONTRIBUTING.md).
      - name: Build documentation with warnings as errors
        run: uv run --no-sync --no-build sphinx-build -E -b html -W --keep-going docs docs/_build/html

      - name: Run documentation doctests
        run: uv run --no-sync --no-build sphinx-build -E -b doctest docs docs/_build/doctest

  # Compatibility policy: expensive or environment-independent suites run once
  # (`validation` on 3.12, repo/meta checks on 3.10, minimum dependencies on
  # 3.10). The full behavior suite runs on every supported interpreter, split
  # across two jobs by event. uv.lock resolves three distinct dependency stacks
  # (3.10; 3.11; 3.12-3.14), but interpreter behavior differs, so a pull
  # request runs every supported minor on Linux plus macOS on the newest
  # interpreter (this job); `test-full` keeps the remaining macOS minimum leg
  # on pushes to main, merge groups, the weekly schedule, and manual dispatch.
  # Do not replace legs with a smoke-only subset, and keep the two jobs
  # disjoint: tests/test_release_integrity.py enforces both.
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - python-version: '3.14'
            os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # `--no-build` is not usable here: Python 3.10 resolves zarr 2.x, whose
      # asciitree dependency ships as an sdist-only release.
      - name: Install dependencies
        run: uv sync --locked --dev

      # Repo/meta checks are owned by the single `meta` job; validation by
      # the single `validation` job. Do not reintroduce them here: the
      # version/distro matrix exists to exercise behavior on each interpreter.
      # `-n auto` spreads the suite over the runner's cores; it is deliberately
      # not in `addopts` so local debugging (`-s`, `--pdb`) stays single-process.
      - name: Run core tests
        run: >
          uv run --no-sync --no-build pytest -n auto
          --ignore=tests/test_release_integrity.py
          --ignore=tests/test_review_scripts.py
          --ignore=tests/test_type_checking.py

  # The remaining leg of the full matrix; see the policy above `test`. Keep the
  # steps the same as `test` (the integrity tests compare the core command) so a
  # leg means the same thing in both jobs.
  test-full:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        os: [macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # Python 3.10 resolves zarr 2.x, whose asciitree dependency ships as an
      # sdist-only release, so source builds must stay allowed here.
      - name: Install dependencies
        run: uv sync --locked --dev  # NOSONAR: 3.10 needs the sdist-only asciitree from the zarr 2.x stack

      - name: Run core tests
        run: >
          uv run --no-sync --no-build pytest -n auto
          --ignore=tests/test_release_integrity.py
          --ignore=tests/test_review_scripts.py
          --ignore=tests/test_type_checking.py

  # Rust gate for the optional native backend (crates/, built as
  # `climate_indices._native`). The compiler comes from rust-toolchain.toml;
  # `PYO3_PYTHON` points the `climate-py` test binary at the interpreter whose
  # libpython it links. Pure-Python legs above never install a Rust toolchain,
  # so they keep proving the fallback.
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # Any supported interpreter links for `cargo test`; 3.12 is the newest one
      # whose locked dev group installs from wheels alone, so `--no-build` works.
      - name: Install dependencies
        run: uv sync --locked --dev --no-build

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Cargo tests
        run: cargo test --workspace

  # The core suite with the Rust extension built, on the pull-request boundary
  # legs of `test` (a subset of its matrix, not a new product).
  # CLIMATE_INDICES_REQUIRE_NATIVE turns the parity tests' skip-when-absent into a
  # failure, so a broken build can never pass by skipping them.
  test-native:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CLIMATE_INDICES_REQUIRE_NATIVE: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
        os: [ubuntu-latest]
        include:
          - python-version: '3.14'
            os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # `--no-build` is not usable here: Python 3.10 resolves zarr 2.x, whose
      # asciitree dependency ships as an sdist-only release, and cartopy has no
      # Python 3.14 wheel.
      - name: Install dependencies
        run: uv sync --locked --dev  # NOSONAR: 3.10 needs the sdist-only asciitree and 3.14 the sdist-only cartopy

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Build the Rust extension
        run: uv run --no-sync --no-build maturin develop --release

      - name: Check the extension imports
        run: uv run --no-sync --no-build python -c "import climate_indices._native"

      - name: Run core tests
        run: >
          uv run --no-sync --no-build pytest -n auto
          --ignore=tests/test_release_integrity.py
          --ignore=tests/test_review_scripts.py
          --ignore=tests/test_type_checking.py

      # The core run above already covers both of these; naming them here means a
      # native leg that collected nothing from the consolidated suite is a visible
      # failure rather than a silent pass (CLIMATE_INDICES_REQUIRE_NATIVE=1 is set
      # for the job, so neither module may skip).
      - name: Run the consolidated parity suite
        run: >
          uv run --no-sync --no-build pytest -q
          tests/test_native_parity_registry.py tests/test_native_e2e_parity.py

      - name: Record cross-backend parity maxima
        run: uv run --no-sync --no-build python scripts/native_parity_maxima.py >> "$GITHUB_STEP_SUMMARY"

  # Builds a release binary wheel per boundary interpreter and platform, then
  # installs it outside the checkout and proves SPI dispatches to the bundled
  # extension. Publishing is not wired here: the published wheel matrix,
  # manylinux floor, and abi3 policy belong to RUST-013. Windows is a smoke
  # build on the newest interpreter only.
  native-wheel:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
        os: [ubuntu-latest, macos-latest]
        include:
          - python-version: '3.14'
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # Only the locked maturin is needed, but the dev group is installed whole to
      # stay on the locked toolchain. `--no-build` is not usable here: Python 3.10
      # resolves zarr 2.x, whose asciitree dependency ships as an sdist-only
      # release, and cartopy has no Python 3.14 wheel.
      - name: Install dependencies
        run: uv sync --locked --dev  # NOSONAR: 3.10 needs the sdist-only asciitree and 3.14 the sdist-only cartopy

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Build native wheel
        run: uv run --no-sync --no-build maturin build --release --interpreter python --out dist-native

      # maturin tags Linux wheels for the runner's glibc via auditwheel; the
      # check only asserts a manylinux tag was produced, not which floor.
      - name: Test native wheel installation
        run: |
          set -euo pipefail
          WHEEL="$(find dist-native -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "${WHEEL}"
          if [ "${RUNNER_OS}" = "Linux" ]; then
            case "${WHEEL}" in *manylinux*) ;; *) echo "not a manylinux wheel: ${WHEEL}"; exit 1 ;; esac
          fi
          python -m venv "${RUNNER_TEMP}/native-wheel"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            VENV_PYTHON="${RUNNER_TEMP}/native-wheel/Scripts/python.exe"
          else
            VENV_PYTHON="${RUNNER_TEMP}/native-wheel/bin/python"
          fi
          "${VENV_PYTHON}" -m pip install --upgrade pip
          "${VENV_PYTHON}" -m pip install "${WHEEL}"
          cd "${RUNNER_TEMP}"
          "${VENV_PYTHON}" - <<'PY'
          import os
          from pathlib import Path

          import numpy as np

          import climate_indices
          from climate_indices import _native, compute, indices

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for module in (climate_indices, _native):
              assert not Path(module.__file__).resolve().is_relative_to(workspace), module.__file__


          class Recorder:
              def __init__(self, module):
                  self.module = module
                  self.calls = set()

              def __getattr__(self, name):
                  self.calls.add(name)
                  return getattr(self.module, name)


          recorder = Recorder(_native)
          compute._native = recorder
          values = np.random.default_rng(0).gamma(2.0, 30.0, 360)
          with np.errstate(all="ignore"):
              result = indices.spi(values, 3, indices.Distribution.gamma, 1990, 1990, 2019, compute.Periodicity.monthly)
          assert np.isfinite(result[2:]).all() and np.isnan(result[:2]).all()
          assert recorder.calls == {"gamma_parameters", "gamma_probabilities", "norm_ppf"}, recorder.calls
          PY

  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Install dependencies
        run: uv sync --locked --dev --no-build

      - name: Run validation tests
        run: uv run --no-sync --no-build pytest -m validation

  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Minimum supported Python: keeps the tomllib/tomli and
      # typing_extensions compatibility branches exercised on every PR.
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # `--no-install-package`: the meta checks never import zarr, and Python
      # 3.10 resolves zarr 2.x, whose asciitree dependency is sdist-only.
      - name: Install dependencies
        run: uv sync --locked --dev --no-build --no-install-package zarr --no-install-package asciitree

      - name: Run repo and meta checks
        run: >
          uv run --no-sync --no-build pytest
          tests/test_release_integrity.py
          tests/test_review_scripts.py
          tests/test_type_checking.py

  test-minimum-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # `--no-build` is not usable here: Python 3.10 resolves zarr 2.x, whose
      # asciitree dependency ships as an sdist-only release.
      - name: Install minimum dependencies
        run: uv sync --no-dev --group test --resolution lowest-direct

      - name: Run core tests with minimum dependencies
        run: >
          uv run --no-sync --no-build pytest -n auto
          --ignore=tests/test_release_integrity.py
          --ignore=tests/test_review_scripts.py
          --ignore=tests/test_type_checking.py

  notebooks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Install dependencies
        run: uv sync --locked --dev --no-build

      - name: Execute 3.0.0 notebooks
        timeout-minutes: 10
        run: >
          uv run --no-sync --no-build jupyter nbconvert --execute --to notebook --inplace
          notebooks/xarray_getting_started.ipynb
          notebooks/palmer_indices_xarray.ipynb
          notebooks/eddi_xarray.ipynb

      # The Zarr/Dask tutorial is owned by tests/test_e2e_with_dask.py in the
      # core suite; do not re-add a notebook-execution step here (#917).

  security-audit:
    permissions:
      contents: read
      actions: none
      checks: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      packages: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Install dependencies
        run: uv sync --locked --only-group security --no-build

      - name: Export runtime requirements
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file runtime-requirements.txt

      - name: Run pip-audit
        run: uv run --no-sync --no-build pip-audit --requirement runtime-requirements.txt --disable-pip
