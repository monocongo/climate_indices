name: CFFWIS Linux diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLIMATE_INDICES_REQUIRE_NATIVE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Build the Rust extension
        run: uv run --no-sync --no-build maturin develop --release
      - name: Record CPU and numerical differences
        run: uv run --no-sync --no-build python scripts/diagnose_cffwis_1513.py
      - name: Reproduce the unchanged module
        id: baseline
        continue-on-error: true
        run: >-
          uv run --no-sync --no-build pytest tests/test_fire_cffwis_behavior.py
      - name: Repeat without AVX-512 NumPy dispatch
        env:
          NPY_DISABLE_CPU_FEATURES: X86_V4,AVX512_ICL,AVX512_SPR
        run: |
          uv run --no-sync --no-build python scripts/diagnose_cffwis_1513.py
          uv run --no-sync --no-build pytest tests/test_fire_cffwis_behavior.py
      - name: Record the baseline outcome
        if: always()
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
        run: |
          echo "Unchanged module outcome: $BASELINE_OUTCOME" \
            >> "$GITHUB_STEP_SUMMARY"
