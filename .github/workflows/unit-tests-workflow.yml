name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  # Full matrix (see the `test-full` job) on days when nothing merges, so a
  # runner-image or interpreter patch release cannot break a leg unnoticed.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancelling a main-branch run would discard the only check of the merged
  # result, so only supersede pull request runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Install dependencies
        run: uv sync --locked --dev --no-build

      - name: Run ruff linter
        run: uv run --no-sync --no-build ruff check src/ tests/

      - name: Check ruff formatting
        run: uv run --no-sync --no-build ruff format --check src/ tests/

      # Also checks tests/test_type_checking.py, whose assert_type() calls are
      # invisible to pytest; see that module's docstring.
      - name: Run mypy type checker
        run: uv run --no-sync --no-build mypy src/ tests/test_type_checking.py

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Never leave the job token in .git/config: this job runs
      # contributor-controlled Sphinx code and doctests.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      # Read the Docs installs the same `docs` extra from uv.lock (see
      # .readthedocs.yaml), so the gate and the published build resolve
      # identical documentation dependencies.
      - name: Install dependencies
        run: uv sync --locked --no-dev --extra docs --no-build

      # Warnings are errors and the doctest builder proves the examples run.
      # `-E` forces a fresh read so a cached environment cannot hide a warning;
      # the same commands run locally (CONTRIBUTING.md).
      - name: Build documentation with warnings as errors
        run: uv run --no-sync --no-build sphinx-build -E -b html -W --keep-going docs docs/_build/html

      - name: Run documentation doctests
        run: uv run --no-sync --no-build sphinx-build -E -b doctest docs docs/_build/doctest

  # Compatibility policy: expensive or environment-independent suites run once
  # (`validation` on 3.12, repo/meta checks on 3.10, minimum dependencies on
  # 3.10). The full behavior suite runs on every supported interpreter, split
  # across two jobs by how much a leg adds. uv.lock resolves three distinct
  # dependency stacks: 3.10 (numpy 2.2, pandas 2, zarr 2.x), 3.11 (zarr 3.1),
  # and 3.12-3.14 (identical packages, zarr 3.3). A pull request therefore runs
  # one leg per stack plus both support boundaries and macOS on the newest
  # interpreter (this job); the legs that repeat a stack (`test-full`) run on
  # pushes to main, merge groups, the weekly schedule, and manual dispatch.
  # Do not replace legs with a smoke-only subset, and keep the two jobs
  # disjoint: tests/test_release_integrity.py enforces both.
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.14']
        os: [ubuntu-latest]
        include:
          - python-version: '3.14'
            os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      # `--no-build` is not usable here: Python 3.10 resolves zarr 2.x, whose
      # asciitree dependency ships as an sdist-only release.
      - name: Install dependencies
        run: uv sync --locked --dev

      # Repo/meta checks are owned by the single `meta` job; validation by
      # the single `validation` job. Do not reintroduce them here: the
      # version/distro matrix exists to exercise behavior on each interpreter.
      # `-n auto` spreads the suite over the runner's cores; it is deliberately
      # not in `addopts` so local debugging (`-s`, `--pdb`) stays single-process.
      - name: Run core tests
        run: >
          uv run --no-sync --no-build pytest -n auto
          --ignore=tests/test_release_integrity.py
          --ignore=tests/test_review_scripts.py
          --ignore=tests/test_type_checking.py

  # The remaining legs of the full matrix; see the policy above `test`. Keep
  # the steps identical to `test` (the integrity tests compare the core
  # command) so a leg means the same thing in both jobs.
  test-full:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
        os: [ubuntu-latest]
        include:
          - python-version: '3.10'
            os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      # `--no-build` is not usable here: Python 3.10 resolves zarr 2.x, whose
      # asciitree dependency ships as an sdist-only release.
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run core tests
        run: >
          uv run --no-sync --no-build pytest -n auto
          --ignore=tests/test_release_integrity.py
          --ignore=tests/test_review_scripts.py
          --ignore=tests/test_type_checking.py

  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Install dependencies
        run: uv sync --locked --dev --no-build

      - name: Run validation tests
        run: uv run --no-sync --no-build pytest -m validation

  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Minimum supported Python: keeps the tomllib/tomli and
      # typing_extensions compatibility branches exercised on every PR.
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      # `--no-install-package`: the meta checks never import zarr, and Python
      # 3.10 resolves zarr 2.x, whose asciitree dependency is sdist-only.
      - name: Install dependencies
        run: uv sync --locked --dev --no-build --no-install-package zarr --no-install-package asciitree

      - name: Run repo and meta checks
        run: >
          uv run --no-sync --no-build pytest
          tests/test_release_integrity.py
          tests/test_review_scripts.py
          tests/test_type_checking.py

  test-minimum-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      # `--no-build` is not usable here: Python 3.10 resolves zarr 2.x, whose
      # asciitree dependency ships as an sdist-only release.
      - name: Install minimum dependencies
        run: uv sync --no-dev --group test --resolution lowest-direct

      - name: Run core tests with minimum dependencies
        run: >
          uv run --no-sync --no-build pytest -n auto
          --ignore=tests/test_release_integrity.py
          --ignore=tests/test_review_scripts.py
          --ignore=tests/test_type_checking.py

  notebooks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Install dependencies
        run: uv sync --locked --dev --no-build

      - name: Execute 3.0.0 notebooks
        timeout-minutes: 10
        run: >
          uv run --no-sync --no-build jupyter nbconvert --execute --to notebook --inplace
          notebooks/xarray_getting_started.ipynb
          notebooks/palmer_indices_xarray.ipynb
          notebooks/eddi_xarray.ipynb

      # The Zarr/Dask tutorial is owned by tests/test_e2e_with_dask.py in the
      # core suite; do not re-add a notebook-execution step here (#917).

  security-audit:
    permissions:
      contents: read
      actions: none
      checks: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      packages: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Install dependencies
        run: uv sync --locked --only-group security --no-build

      - name: Export runtime requirements
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file runtime-requirements.txt

      - name: Run pip-audit
        run: uv run --no-sync --no-build pip-audit --requirement runtime-requirements.txt --disable-pip
