name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run ruff linter
        run: uv run --no-sync --no-build ruff check src/ tests/

      - name: Check ruff formatting
        run: uv run --no-sync --no-build ruff format --check src/ tests/

      - name: Run mypy type checker
        run: uv run --no-sync --no-build mypy src/

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - python-version: '3.10'
            os: macos-latest
          - python-version: '3.14'
            os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run core tests
        run: uv run --no-sync --no-build pytest -m "not benchmark and not validation"

      - name: Run validation tests
        run: uv run --no-sync --no-build pytest -m validation

      - name: Pattern compliance check
        run: uv run --no-sync --no-build pytest tests/test_pattern_compliance.py -v

  test-minimum-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install minimum dependencies
        run: uv sync --no-dev --group test --resolution lowest-direct

      - name: Run core tests with minimum dependencies
        run: uv run --no-sync --no-build pytest -m "not benchmark and not validation"

      - name: Run validation tests with minimum dependencies
        run: uv run --no-sync --no-build pytest -m validation

  notebooks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v5

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Execute v2.5 notebooks
        timeout-minutes: 10
        run: >
          uv run --no-sync --no-build jupyter nbconvert --execute --to notebook --inplace
          notebooks/xarray_getting_started.ipynb
          notebooks/palmer_indices_xarray.ipynb
          notebooks/eddi_xarray.ipynb

  security-audit:
    permissions:
      contents: read
      actions: none
      checks: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      packages: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install dependencies
        run: uv sync --locked --only-group security

      - name: Export runtime requirements
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file runtime-requirements.txt

      - name: Run pip-audit
        run: uv run --no-sync --no-build pip-audit --requirement runtime-requirements.txt --disable-pip
