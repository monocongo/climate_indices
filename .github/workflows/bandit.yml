# Bandit is a security linter designed to find common security issues in Python code.
# This workflow runs Bandit on the repository and uploads the results as SARIF,
# where they appear under the Security tab of the repository.
#
# The steps are inline rather than a third-party action because this repository
# requires every action, including those a composite action calls internally,
# to be pinned to a full-length commit SHA.

# https://pypi.org/project/bandit/ is Apache v2.0 licensed, by PyCQA

name: Bandit
on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '19 5 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancelling a main-branch run would discard the only check of the merged
  # result, so only supersede pull request runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bandit:
    # Fork pull requests get a read-only token, so the SARIF upload would fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Bandit Scan
        # --exit-zero: report findings in the Security tab without failing the job
        # --exclude ./tests: pytest asserts (B101) are 99% of the findings otherwise
        run: |
          pip install --only-binary :all: 'bandit[sarif]==1.9.4'
          bandit --format sarif --output results.sarif --recursive --exit-zero --exclude ./tests .
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: results.sarif
