# Cross-platform evidence for the Rust Palmer kernels (REFIMPL-34, #1636).
#
# Runs the Rust-versus-Python parity tests and the 344-division measurement on each
# release wheel target, then compares the float64 bytes of every output across
# platforms. Manual only: nothing here gates a pull request. The Rust comparison
# fails on any difference; the Python comparison is a control that localizes a
# difference to NumPy or the platform math library, so it reports without failing.
name: palmer-reproducibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CLIMATE_INDICES_REQUIRE_NATIVE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Install dependencies
        run: uv sync --locked --dev --no-build

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Build the Rust extension
        run: uv run --no-sync --no-build maturin develop --release

      - name: Measure parity on the 344 divisions
        run: uv run --no-sync --no-build python scripts/measure_palmer_parity.py measure --out "parity-${{ matrix.target }}.json"

      - name: Upload the measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: parity-${{ matrix.target }}
          path: parity-${{ matrix.target }}.json
          if-no-files-found: error

      # Upload the report first so a parity test failure does not hide the measurement.
      - name: Run the Palmer parity tests
        run: uv run --no-sync --no-build pytest -q -n auto tests/test_native_parity_palmer.py

  compare:
    needs: measure
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # an explicit bash adds pipefail, so a failing compare is not hidden by `| tee`
    defaults:
      run:
        shell: bash
    steps:
      # Require both the measurement and the parity tests to pass on all targets.
      - name: Require every platform to finish successfully
        run: test "${{ needs.measure.result }}" = success

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Install dependencies
        run: uv sync --locked --dev --no-build

      - name: Download every platform's measurement
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: parity-*
          merge-multiple: true

      - name: Compare the Rust results byte for byte
        run: |
          uv run --no-sync --no-build python scripts/measure_palmer_parity.py compare parity-*.json --backend rust | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare the Python results byte for byte (control)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          uv run --no-sync --no-build python scripts/measure_palmer_parity.py compare parity-*.json --backend python | tee -a "$GITHUB_STEP_SUMMARY"
