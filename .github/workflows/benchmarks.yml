name: benchmarks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up project
        run: uv sync --locked --group dev

      - name: Run benchmarks
        run: |
          uv run --no-sync --no-build pytest -m benchmark --benchmark-enable \
            --benchmark-json=benchmark-results.json \
            --benchmark-columns=mean,stddev,rounds

      - name: Upload benchmark results
        if: ${{ !cancelled() }}  # preserve timing diagnostics when the benchmark gate fails
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmark-results.json

      - name: Check for regressions
        run: |
          if [ -f .benchmarks/baseline.json ]; then
            uv run --no-sync --no-build pytest-benchmark compare \
              .benchmarks/baseline.json benchmark-results.json \
              --csv=comparison.csv
          else
            echo "No baseline found — skipping regression check"
          fi
