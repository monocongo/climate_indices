name: benchmarks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Set up project
        run: uv sync --locked --group dev

      - name: Run benchmarks
        run: |
          uv run --no-sync --no-build pytest -m benchmark --benchmark-enable \
            --benchmark-json=benchmark-results.json \
            --benchmark-columns=mean,stddev,rounds

      - name: Upload benchmark results
        if: ${{ !cancelled() }}  # preserve timing diagnostics when the benchmark gate fails
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: benchmark-results.json

      - name: Check for regressions
        run: |
          if [ -f .benchmarks/baseline.json ]; then
            uv run --no-sync --no-build pytest-benchmark compare \
              .benchmarks/baseline.json benchmark-results.json \
              --csv=comparison.csv
          else
            echo "No baseline found — skipping regression check"
          fi
