# climate_indices Commit Conventions

## Action

Use Conventional Commit messages. Common types in this repository are `feat`,
`fix`, `docs`, `test`, `refactor`, `chore`, `ci`, `build`, and `style`; add a
scope when it clarifies the change, such as `fix(review):` or `chore(deps):`.

## Evidence

- Repository history uses conventional commit messages across feature, bug-fix,
  documentation, test, maintenance, CI, build, and formatting changes.
- Examples: `feat: add rolling-window extreme Z-index sum with wet-side anomaly filter`,
  `fix: repair broken CLI Palmers dispatch and add agent-facing domain docs`.

