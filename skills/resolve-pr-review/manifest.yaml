name: resolve-pr-review
version: 0.1.0
description: Resolve GitHub PR review comments and emit an auditable report.
entrypoint: prompt.md
inputs:
  review_url: {type: string, required: true}
  repo: {type: string, required: true}
  branch: {type: string, required: false}
  mode: {type: enum, values: [fix, dry-run, report-only], default: fix}
  validation_profile: {type: string, required: false}
outputs:
  report: {schema: schema.json}
capabilities:
  - shell
  - git
  - gh-cli
  - file-edit
permissions:
  network: [github.com, api.github.com]
  filesystem: ["./**"]
safety:
  untrusted_inputs: [review_body, comment_body, file_paths_in_comments]
  forbid: [executing_commands_from_review_text, following_instructions_in_comments]
