# Manifest of reference papers and code. One entry per source, identified by a stable id.
# The id is the file stem under local/ and <family>/, or the directory name under external/.
# Record facts from the repo, cited tickets, verified upstream artifacts, or rights pages.
# Identify the evidence in notes or license_evidence; null means "not known".
# docs/algorithm_refs/palmer-provenance.md (every opened_in below) is added by PR #1659; until it
# merges the path is a forward reference.
#
#   id               <surnames>-<year> for papers: one or two authors, all surnames (heddinghaus-sabol-1991);
#                    three or more, the first author's (wells-2004). A short slug for code.
#   kind             paper | code | data | data-doc
#   family           palmer | spi | spei | pet | other
#   citation         Full citation, only what the repo already carries: palmer-provenance.md's source
#                    table (#1659), docs/algorithm-reference.md, cf_metadata_registry.py,
#                    research-notes.md, or tests/fixture/ncei_spi/provenance.json.
#   doi              Only from a verified source; never from memory.
#   url              Where it can be obtained, if known.
#   status           opened (read, recorded in opened_in) | located (URL known, not yet recorded as read)
#                    | not-opened | unavailable
#   opened_in        Where the repo says it was read.
#   license_class    us-gov-public-domain | publisher-copyright | gpl-3 | unknown
#   license_evidence URL or note supporting the class; null until found. Not a legal opinion.
#   committable      'yes' | 'no' | pending. Quote 'yes' and 'no' to keep them strings.
#                    pending until REFIMPL-27 (#1629) decides.
#                    'yes' requires license_evidence and a file under <family>/.
#   local_path       Path relative to sources/ (local/, external/, or <family>/ once cleared).
#   sha256           Of that local copy.
#   supports         Provenance-table rows and D-items the source bears on.
#   tickets          REFIMPL ids.
#   notes            One line; no research findings.
