# R dependencies resolved at install time (CRAN current as of 2026-11-18); not separately pinned.
r_resolved: {lmom: "3.3", lmomco: "2.5.8", TLMoments: "0.7.5.3", fitdistrplus: "1.2-6", gamlss: "5.5-5", flexsurv: "2.3.2", zoo: "1.9-1", xts: "0.14.3", goftest: "1.2-3", checkmate: "2.3.4"}
r_lmom_archive_sha256: fdc3a798b2542a4677f4a89fd8f59d2dbe229deccc08cf63702490a448f7f458   # lmom 3.3; CPL-1.0, compiles Fortran

services:
  # Live products. No hash; the record is the access date and the exact request.
  - name: Climate Engine API standard_index
    decision: include
    accessed: 2026-11-18
    endpoint: https://api.climateengine.org/timeseries/standard_index/coordinates
    request_shape: {dataset: GRIDMET, variable: pr, distribution: nonparametric, accumulation: 90, start_year: 1981, end_year: 2016, coordinates: [[-84.9, 30.7]]}
    last_returned_date: 2020-07-30
    credentials: environment variable CE_API_KEY (never committed)
    requests_made: 1
    raw_response_committed: false
  - name: Earth Engine GRIDMET/DROUGHT
    decision: include
    accessed: 2026-11-18
    collection: GRIDMET/DROUGHT
    request_shape: {image: "20200628", band: spi90d, point: [-84.9, 30.7]}
    credentials: OAuth plus EE_PROJECT (never committed)
    requests_made: 1

products:
  # Existing fixtures; provenance is in each fixture's provenance.json.
  - name: NCEI climdiv SPI
    decision: include
    fixture: tests/fixture/ncei_spi/provenance.json
  - name: NOAA PSL EDDI
    decision: include
    fixture: tests/fixture/noaa-eddi-1month/provenance.json
  - name: SPEIbase v2.11
    decision: include
    fixture: tests/fixture/speibase/provenance.json
    built_with: SPEI 1.8.1, CRU TS 4.09   # per spei.csic.es
    license: "unresolved: ODbL 1.0 (spei.csic.es, share-alike) and CC-BY 4.0 (Earth Engine catalog); see comparators.md"
  - name: SPEI Global Drought Monitor
    decision: exclude
    reason: JavaScript map viewer; no download or API documentation located; Thornthwaite PET. Shared SPEI code with SPEIbase is an inference, not stated by the site.
  - name: nClimGrid SPI
    decision: exclude
    reason: circular — this repository's author maintains the gridded nClimGrid SPI/SPEI/PET tooling (tests/fixture/ncei_spi/provenance.json).

other:
  - name: MATLAB SDAT
    decision: exclude
    reason: requires MATLAB; original toolbox not obtained. hydrocodeir/Standardized-Drought-Analysis-Toolbox (GPL-3.0) is a re-implementation, not the original.

