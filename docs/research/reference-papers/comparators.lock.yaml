    license: MIT
    resolved: {numpy: 2.5.5, pandas: 2.3.3, xarray: 2026.9.0}
  - name: PyETo
    version: null          # no release; not on PyPI or conda-forge
    decision: include
    source: git
    url: https://github.com/woodcrafty/PyETo
    commit: 79ddd88d727c7ebdad0ce26e220528d2921b66ea
    commit_date: 2022-08-31
    archive_sha256: 92b971c1f0b82027a5ac5291ca3034fc9e19008d763bdb262a6b74ed44c2f83d   # unstable; pin by commit
    license: BSD-3-Clause
