    resolved: {numpy: 2.5.5, pandas: 3.1.1}   # numpy and pandas only for the smoke script; PyETo has no dependencies
  - name: precip-index
    version: null
    decision: exclude
    source: git
    url: https://github.com/bennyistanto/precip-index
