    sha256: 6a1f65c093568248a093d9ef14e76d62dade6dee6064a381b9f044980f0ce323
    released: 2026-09-01
    license: Apache-2.0
    resolved: {numpy: 2.5.5, scipy: 1.18.1, pandas: 3.1.1, matplotlib: 3.11.2, lmoments3: 1.0.8}
  - name: pyet
    version: 1.5.0
    decision: include
    source: pypi
