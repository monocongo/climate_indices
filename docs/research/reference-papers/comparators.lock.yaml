# Comparator pins for the reference-paper work (REFIMPL-03, issue 1605).
#
# Direct pins plus the key resolved dependencies from the throwaway smoke
# environments. This is not a full lockfile; REFIMPL-08 (issue 1610) owns the
# harness environments and their locking. Narrative and decisions are in
# comparators.md. Comparator code is never vendored.
#
# sha256 values were computed by downloading each artifact on 2026-11-18, and the
# four PyPI hashes also match the index metadata. GitHub archive hashes are not
# stable guarantees; the commit is the pin for those.
#
# `decision` is `include` or `exclude`; `provisional: true` marks a conditional
# include. Paths are relative to the repository root, except `dockerfile:` and the
# `containers:` entries, which are relative to this file's directory.
schema_version: 1
surveyed: 2026-11-18
platform_tested: macOS arm64 (Darwin 27.2.0)   # Linux headless run only for the containers section below
runtimes:
  python: 3.12.13        # one `uv venv` per package, uv 0.13.9
  r: 4.6.2
  r_note: >-
    The R builds used R_MAKEVARS_USER overriding FLIBS, because this machine's
    Makeconf points at a gfortran runtime directory that does not exist.

