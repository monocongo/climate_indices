[package]
name = "climate-indices"
description = "Pure-Rust numerical kernels for climate indices: SPI, SPEI, EDDI, PET, Palmer, fire weather, and flood"
# independent 0.x track, not the workspace or PyPI version (docs/adr/0021); the
# pre-release rehearses the 0.1.0 release path (docs/release-process.md)
version = "0.1.0-rc.1"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["climate", "drought", "spi", "spei", "hydrology"]
categories = ["science", "science::geo", "mathematics"]
publish = true

[package.metadata.docs.rs]
# pure numerics with no features or platform-specific code: one target is enough
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
ndarray = "0.17.2"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "kernels"
harness = false
