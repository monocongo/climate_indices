[package]
name = "climate-indices"
description = "Pure-Rust kernels for drought, fire weather, flood, empirical distributions, runs, compound metrics, and aggregation"
# independent 0.x track, not the workspace or PyPI version (docs/adr/0021)
version = "0.1.1"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["climate", "drought", "spi", "spei", "hydrology"]
categories = ["science", "science::geo", "mathematics"]
publish = true

[package.metadata.docs.rs]
# pure numerics with no features or platform-specific code: one target is enough
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
ndarray = "0.17.2"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "kernels"
harness = false
